# Official reference settings for the four published baselines.
# These follow each upstream repository, not a hardware-specific tuning run.

dataset: dataset
prepared: work/prepared
runs: runs

deepcrack:
  batch_size: 1
  load_width: 256
  load_height: 256
  niter: 400
  niter_decay: 300
  lr: 0.0001
  loss_mode: focal
  norm: batch
  num_classes: 1

swinunet:
  img_size: 224
  batch_size: 24
  max_epochs: 150
  base_lr: 0.05
  num_classes: 2
  cfg: configs/swin_tiny_patch4_window7_224_lite.yaml

cracksegformer:
  phi: b0
  epochs: 200
  batch_size: 16
  lr: 0.00006
  num_classes: 1
  img_size: 512

bgcrack:
  epoch: 70
  batchsize: 9
  lr: 0.006
  img_size: 512
  dataset: steel_cracks_with_edge
  modelname: BGCrack
