[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fracturebench"
version = "1.0.0"
description = "Multimodal tunnel-fracture segmentation benchmark and reference baselines."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Multimodal Fracture Benchmark contributors"}]
dependencies = [
  "numpy>=1.23",
  "pillow>=9.0",
  "scipy>=1.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.scripts]
fracturebench = "fracturebench.cli:main"

[tool.setuptools.packages.find]
include = ["fracturebench*"]
